<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grat" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0 L0 0 0 56" fill="none" stroke="#6FA8DC" stroke-width="1" opacity=".045"/>
    </pattern>
    <g id="mug" shape-rendering="crispEdges">
      <g fill="#8799A6">
        <rect x="1" y="0" width="1" height="1"/><rect x="0" y="1" width="1" height="1"/><rect x="1" y="2" width="1" height="1"/>
        <rect x="4" y="0" width="1" height="1"/><rect x="3" y="1" width="1" height="1"/><rect x="4" y="2" width="1" height="1"/>
        <rect x="7" y="0" width="1" height="1"/><rect x="6" y="1" width="1" height="1"/><rect x="7" y="2" width="1" height="1"/>
      </g>
      <g fill="#E8E1CF">
        <rect x="0" y="4" width="10" height="1"/>
        <rect x="0" y="5" width="1" height="7"/><rect x="9" y="5" width="1" height="7"/>
        <rect x="1" y="12" width="8" height="1"/>
      </g>
      <rect x="1" y="5" width="8" height="2" fill="#E2513A"/>
      <rect x="1" y="7" width="8" height="5" fill="#1A2530"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="#0F161C"/>
  <rect width="1200" height="630" fill="url(#grat)"/>

  <!-- header lockup -->
  <g transform="translate(80,74) scale(2.7)"><use href="#mug"/></g>
  <text x="118" y="118" fill="#E8E1CF" font-family="Archivo,Arial,sans-serif"
        font-size="30" font-weight="800" letter-spacing="3">SOCDESK</text>
  <text x="284" y="118" fill="#8799A6" font-family="IBM Plex Mono,monospace"
        font-size="16" letter-spacing="3">TLP:CLEAR</text>

  <!-- wordmark: S [mug] CDESK -->
  <text x="80" y="330" fill="#E8E1CF" font-family="Archivo,Arial Black,sans-serif"
        font-size="150" font-weight="800" letter-spacing="-3">S</text>
  <g transform="translate(184,196) scale(10.3)"><use href="#mug"/></g>
  <text x="300" y="330" fill="#E8E1CF" font-family="Archivo,Arial Black,sans-serif"
        font-size="150" font-weight="800" letter-spacing="-3">CDESK</text>

  <text x="80" y="392" fill="#8799A6" font-family="Archivo,Arial,sans-serif"
        font-size="25" font-weight="600" letter-spacing="3">THE ANALYST'S FIRST STOP — OPEN-SOURCE THREAT INTELLIGENCE</text>

  <line x1="80" y1="430" x2="1120" y2="430" stroke="#3C566C" stroke-width="1"/>

  <text x="80" y="480" fill="#E8E1CF" font-family="Archivo,Arial,sans-serif" font-size="27">
    One paste instead of six tabs.</text>
  <text x="80" y="522" fill="#8799A6" font-family="IBM Plex Mono,monospace" font-size="18">
    Verdict from CISA KEV + NVD + EPSS, pivots to every public reputation</text>
  <text x="80" y="550" fill="#8799A6" font-family="IBM Plex Mono,monospace" font-size="18">
    service, and an escalation summary ready to paste into the ticket.</text>

  <text x="80" y="596" fill="#8799A6" font-family="IBM Plex Mono,monospace"
        font-size="15" letter-spacing="2">SOCDESK.IO · NO ACCOUNTS · NO TRACKING · NOTHING LEAVES YOUR BROWSER</text>
</svg>
