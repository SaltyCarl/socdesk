  <circle cx="16" cy="16" r="12" fill="none" stroke="#E8E1CF" stroke-width="2"/>
  <path d="M16 6 L25.5 22 L6.5 22 Z" fill="none" stroke="#E8E1CF" stroke-width="2"
        stroke-linejoin="miter"/>
  <circle cx="16" cy="16" r="3" fill="#E2513A"/>
</svg>
