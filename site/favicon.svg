<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 26">
  <!-- The SanchezOnSecurity mug, in SOCDesk's ink. Same pixel construction:
       three steam wisps, bone shell, crema band, dark body. -->
  <rect width="20" height="26" fill="#0F161C"/>
  <g transform="translate(5 1)" shape-rendering="crispEdges">
    <g fill="#8799A6">
      <rect x="1" y="0" width="1" height="1"/><rect x="0" y="1" width="1" height="1"/><rect x="1" y="2" width="1" height="1"/>
      <rect x="4" y="0" width="1" height="1"/><rect x="3" y="1" width="1" height="1"/><rect x="4" y="2" width="1" height="1"/>
      <rect x="7" y="0" width="1" height="1"/><rect x="6" y="1" width="1" height="1"/><rect x="7" y="2" width="1" height="1"/>
    </g>
    <g fill="#E8E1CF">
      <rect x="0" y="4" width="10" height="1"/>
      <rect x="0" y="5" width="1" height="7"/><rect x="9" y="5" width="1" height="7"/>
      <rect x="1" y="12" width="8" height="1"/>
    </g>
    <rect x="1" y="5" width="8" height="2" fill="#E2513A"/>
    <rect x="1" y="7" width="8" height="5" fill="#1A2530"/>
  </g>
</svg>
