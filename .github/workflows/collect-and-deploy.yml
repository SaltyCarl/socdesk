name: collect-and-deploy

on:
  schedule:
    - cron: "11,41 * * * *"        # twice hourly, offset from top-of-hour load
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["data/brief.json"]     # Tier 2 (Framework) pushes redeploy the site

concurrency:
  group: collect-and-deploy
  cancel-in-progress: false

permissions:
  contents: write        # commit rolling state + history snapshots

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest tests/ -q

      - name: Run collectors
        run: python run_pipeline.py    # all sources are keyless/public

      - name: Commit state snapshots
        run: |
          git config user.name "SaltyCarl"
          git config user.email "CarlosSanchez1994@live.com"
          git add data/state
          git diff --cached --quiet || git commit -m "data: refresh snapshots"
          git pull --rebase origin main
          git push
        # GITHUB_TOKEN pushes cannot retrigger workflows -> no cron/push loop.
        # The Framework's brief.json pushes use a deploy key, so they DO
        # trigger this workflow. That asymmetry is intentional.

      # Direct upload, deliberately not the Cloudflare Git integration.
      # Git-integration builds are capped at 500/month on the free plan and
      # this workflow deploys ~1,440 times a month; direct uploads are not
      # counted against that cap. It also keeps the source repository private
      # — Cloudflare never needs read access to it.
      # Cloudflare's documented example also passes `gitHubToken` (with
      # `deployments: write`) to record a GitHub Deployment per run. That
      # example assumes deploy-on-push; this workflow runs twice an hour, so it
      # would file ~1,440 deployment records a month. Deliberately omitted.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch decides whether this upload is routed as production or as
          # a preview: it has to equal the project's production branch. A
          # Direct Upload project created through the dashboard takes a default
          # (main) that cannot be edited there afterwards, only via the Update
          # Project API — so rather than hardcode the assumption, read it from
          # a repository variable. If the first run lands in Preview, set
          # CF_PRODUCTION_BRANCH under Settings -> Secrets and variables ->
          # Actions -> Variables to whatever the dashboard reports and re-run.
          # No CLI, no API call.
          command: >-
            pages deploy site --project-name=socdesk
            --branch=${{ vars.CF_PRODUCTION_BRANCH || 'main' }}
