name: collect-and-deploy

on:
  schedule:
    - cron: "11,41 * * * *"        # twice hourly, offset from top-of-hour load
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["data/brief.json"]     # Tier 2 (Framework) pushes redeploy the site

concurrency:
  group: collect-and-deploy
  cancel-in-progress: false

permissions:
  contents: write        # commit rolling state + history snapshots

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest tests/ -q

      - name: Run collectors
        # ThreatFox needs the free abuse.ch Auth-Key; every other collector is
        # keyless/public. IPINFO_TOKEN geolocates the threat IPs at city level
        # (only IPs new since the last run are looked up — see the committed
        # data/state/geo_cache.json — so this stays inside the free quota);
        # without it the pipeline falls back to country-centroid placement. Both
        # are repo secrets, never committed.
        env:
          ABUSECH_API_KEY: ${{ secrets.ABUSECH_API_KEY }}
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
          # Phase 3 community export: D1 REST *query* (read-only). ACCOUNT_ID
          # already exists as a secret but was previously referenced only in the
          # deploy step, so it must be added here for the D1 URL. The DB id and a
          # dedicated D1-Read-only token are new secrets; absent, the builder
          # no-ops to last-known-good (the site behaves exactly as today).
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CF_D1_READ_TOKEN: ${{ secrets.CF_D1_READ_TOKEN }}
        run: python run_pipeline.py

      - name: Commit state snapshots
        run: |
          git config user.name "SaltyCarl"
          git config user.email "CarlosSanchez1994@live.com"
          git add data/state
          git diff --cached --quiet || git commit -m "data: refresh snapshots"
          git pull --rebase origin main
          git push
        # GITHUB_TOKEN pushes cannot retrigger workflows -> no cron/push loop.
        # The Framework's brief.json pushes use a deploy key, so they DO
        # trigger this workflow. That asymmetry is intentional.

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web/ (Vite)
        # Runs AFTER the collectors so run_pipeline's dual-write to
        # web/public/data/state is fresh; Vite copies it into web/dist/data/state,
        # along with web/public/_headers + _redirects. The strict CSP + the SPA
        # deep-link fallback ship with the build output.
        # VITE_TURNSTILE_SITEKEY is inlined at build time (import.meta.env) into
        # the report form's Turnstile widget. This is a PUBLIC site key, so it
        # lives as an Actions *variable* (Settings -> Secrets and variables ->
        # Actions -> Variables), not a secret and NOT a Cloudflare Pages var
        # (this is a direct-upload project — Cloudflare never runs the build).
        # Empty is harmless on builds predating the reporting setup: the widget
        # simply doesn't render.
        env:
          VITE_TURNSTILE_SITEKEY: ${{ vars.VITE_TURNSTILE_SITEKEY }}
        run: |
          npm --prefix web ci
          npm --prefix web run build

      # Direct upload, deliberately not the Cloudflare Git integration.
      # Git-integration builds are capped at 500/month on the free plan and
      # this workflow deploys ~1,440 times a month; direct uploads are not
      # counted against that cap. It also keeps the source repository private
      # — Cloudflare never needs read access to it.
      # Cloudflare's documented example also passes `gitHubToken` (with
      # `deployments: write`) to record a GitHub Deployment per run. That
      # example assumes deploy-on-push; this workflow runs twice an hour, so it
      # would file ~1,440 deployment records a month. Deliberately omitted.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Action bumped to v4 for the Node-24 runtime (clears the deprecation
          # warning), but pin the Wrangler CLI to v3 so deploy behavior is
          # unchanged — migrating the CLI to v4 is a separate deliberate step.
          wranglerVersion: "3"
          # --branch decides whether this upload is routed as production or as
          # a preview: it has to equal the project's production branch. A
          # Direct Upload project created through the dashboard takes a default
          # (main) that cannot be edited there afterwards, only via the Update
          # Project API — so rather than hardcode the assumption, read it from
          # a repository variable. If the first run lands in Preview, set
          # CF_PRODUCTION_BRANCH under Settings -> Secrets and variables ->
          # Actions -> Variables to whatever the dashboard reports and re-run.
          # No CLI, no API call.
          # Deploys web/dist (the Vite build) — the React app supersedes the
          # legacy vanilla site/. Pages Functions are read from the repo-root
          # functions/ dir (project-root-relative, not deploy-dir-relative), so
          # /api/enrich still co-deploys. VALIDATE this on a preview branch first.
          command: >-
            pages deploy web/dist --project-name=socdesk
            --branch=${{ vars.CF_PRODUCTION_BRANCH || 'main' }}
