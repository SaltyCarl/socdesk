id: socdesk-signin-correct-password-blocked
title: Correct password but policy-blocked sign-in bursts
dialect: log_analytics
techniques: [T1078.004]
tables: [SigninLogs]
tested: "2026-09-02"
rationale: >
  ResultType semantics as a credential-compromise signal: 53003 (blocked by
  Conditional Access), 50074 (MFA required), 50076/50079 (MFA required, from
  a different/strong-auth path) all imply the FIRST FACTOR SUCCEEDED — the
  attacker holds a valid password and is being stopped by a second control —
  which is materially different from 50126 (invalid username or password).
  A per-user/IP burst of these is an active-use-of-known-credentials hunt.
  Codes per the Microsoft Entra sign-in error reference. ResultType is a
  STRING in the SigninLogs schema (quoted). Written fresh; emulator-validated.
kql: |
  SigninLogs
  | where ResultType in ("53003", "50074", "50076", "50079")
  | summarize Attempts = count(),
              Codes = make_set(ResultType),
              IPs = make_set(IPAddress),
              FirstSeen = min(TimeGenerated),
              LastSeen = max(TimeGenerated)
    by UserPrincipalName, bin(TimeGenerated, 1h)
  | where Attempts >= 5
  | project TimeGenerated, UserPrincipalName, Attempts, Codes, IPs, FirstSeen, LastSeen
  | order by Attempts desc
