<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none">
  <!-- SOCDESK brand-hybrid favicon — the 16px "rise" cut: a flat coffee mug
       with two periwinkle bars, the tall one breaking the rim (signal rising
       out of the cup). Standalone document, so the hexes are baked and only
       the periwinkle flips via prefers-color-scheme. Coffee is theme-fixed.
       Zero external requests. -->
  <style>
    .cup{stroke:#A6612F}
    .bar{fill:#7C8AFF}
    @media (prefers-color-scheme: light){ .bar{fill:#4A4FD0} }
  </style>
  <path class="cup" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M4.2 5 L4.9 11.2 Q5.05 12.6 6.3 12.6 L9.7 12.6 Q10.95 12.6 11.1 11.2 L11.8 5"/>
  <path class="cup" stroke-linecap="round" stroke-width="1.7" d="M4.2 5 L11.8 5"/>
  <path class="cup" stroke-linecap="round" stroke-width="1.6" d="M11.9 6.5 C14 6.2 14.3 7.8 14.3 8.5 C14.3 9.2 14 10.9 11.9 10.6"/>
  <rect class="bar" x="5.95" y="8.4" width="2.1" height="3.2" rx="0.6"/>
  <rect class="bar" x="8.30" y="3.4" width="2.1" height="8.2" rx="0.7"/>
</svg>
