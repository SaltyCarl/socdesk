<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- SOCDesk favicon — an elegant ceramic CUP with the saucer DROPPED for 16px.
       Mirrors site/favicon.svg exactly: rounded cappuccino-cup body in the locked
       warm brand caramel two-tone (face #C68B5B, deeper caramel shadow face
       #915B32), a cream lip #ECE1CD over a dark coffee opening #43291A, a clean
       C-loop handle, and the periwinkle WAVY steam (the owner's chosen, shipped
       steam). Transparent, theme-aware: the steam flips via prefers-color-scheme
       so it reads on a dark or a light tab strip. Powers this page's real tab
       icon. -->
  <style>
    .steam{stroke:#7C8AFF}
    @media (prefers-color-scheme: light){ .steam{stroke:#4A4FD0} }
  </style>
  <path fill="none" stroke="#915B32" stroke-width="1.7" stroke-linecap="round" d="M12.7,7 C14.7,6.6 15.4,8 15.4,9.1 C15.4,10.2 14.7,11.6 12.7,11.2"/>
  <path fill="#C68B5B" d="M3,5 C2.8,7.6 3.2,10.6 4.4,12.6 Q5.6,13.8 8,13.8 Q10.4,13.8 11.6,12.6 C12.8,10.6 13.2,7.6 13,5 Z"/>
  <path fill="#915B32" d="M8.4,5.6 C8.9,8 9.1,10.6 10,12.4 Q11,13.6 11.6,12.6 C12.8,10.6 13.2,7.6 13,5 Q11,5.7 8.4,5.6 Z"/>
  <ellipse fill="#ECE1CD" cx="8" cy="5" rx="5" ry="1.4"/>
  <ellipse fill="#43291A" cx="8" cy="5.15" rx="3.6" ry="0.9"/>
  <g class="steam" fill="none" stroke-width="1.35" stroke-linecap="round">
    <path d="M5.4,4.4 C4.3,3.3 6.5,2.4 5.4,1"/>
    <path d="M8,4.7 C6.9,3.5 9.1,2.4 8,0.7"/>
    <path d="M10.6,4.4 C9.5,3.3 11.7,2.4 10.6,1"/>
  </g>
</svg>
